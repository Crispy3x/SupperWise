name: Supabase deploy

# Run by hand. Creates the database tables and security rules, deploys the food-scan and delete-account
# functions, stores the Anthropic key as a function secret, and sets the sign-in email to send a 6-digit code.
#
# Repository secrets it needs:
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens → Generate new token
#   SUPABASE_DB_PASSWORD    the database password you chose when creating the project
#   ANTHROPIC_API_KEY       console.anthropic.com → API Keys (used only by the food-scan function)
on:
  workflow_dispatch:

env:
  PROJECT_REF: tgywrfseyrvflhusqzpt
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the secrets are set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Database tables and security rules
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Function secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: supabase secrets set --project-ref "$PROJECT_REF" --yes ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
      - name: Deploy functions
        run: |
          supabase functions deploy scan-food --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --use-api --yes
      - name: Sign-in links open the app
        run: |
          body='{"site_url":"supperwise://login","uri_allow_list":"supperwise://login,supperwise://**","mailer_otp_exp":3600}'
          code=$(curl -s -o /tmp/auth.json -w "%{http_code}" -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "auth config: HTTP $code"; [ "$code" -lt 300 ] || { cat /tmp/auth.json; exit 1; }
      - name: Save the public anon key for the app (it ships in the app by design)
        run: |
          mkdir -p ../out
          curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; ks=json.load(sys.stdin); print(json.dumps([{'name':k.get('name'),'type':k.get('type'),'api_key':k.get('api_key')} for k in ks if k.get('type') in ('publishable', 'legacy') and k.get('name') in ('anon', 'default') and not str(k.get('api_key','')).startswith('sb_secret')], indent=1))" > ../out/public-keys.json
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-public-keys
          path: out/public-keys.json
