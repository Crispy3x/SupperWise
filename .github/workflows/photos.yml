name: Recipe photo candidates

# Finds openly licensed candidate photos for every recipe (Openverse, then Wikimedia Commons) and builds
# contact sheets for choosing them. Run by hand; results are uploaded as the "photo-candidates" artifact.
on:
  workflow_dispatch:
    inputs:
      openverse_budget:
        description: "Openverse searches to use (anonymous limit is 200 a day)"
        default: "180"

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Find candidates
        run: python3 app/tools/photos/find_candidates.py "${{ github.event.inputs.openverse_budget }}"
      - name: Contact sheets
        run: python3 app/tools/photos/make_sheets.py "$RUNNER_TEMP/thumbs" out/sheets
      - run: cp app/tools/photos/candidates.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: photo-candidates
          path: out
