name: App Store Connect setup

# Run by hand after the app record exists. Registers the bundle ID and creates the subscription group, the 6
# subscriptions, their prices in every country, the yearly free trials and the review screenshots.
# Uses the same repository secrets as the TestFlight upload (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "setup (bundle ID and subscriptions), listing (store text, age rating, screenshots) testflight (testers for the latest build) or invite"
        default: "setup"
      site_base:
        description: "Where the privacy and support pages live, e.g. https://crispy3x.github.io/supperwise-site (optional)"
        default: "https://crispy3x.github.io/supperwise-site"
      invite_email:
        description: "For 'invite': the email to invite as a TestFlight tester"
        default: ""

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Which secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for n in TEAM:APPLE_TEAM_ID KID:ASC_KEY_ID ISS:ASC_ISSUER_ID P8:ASC_KEY_P8; do
            v="${n%%:*}"; name="${n##*:}"; val="${!v}"
            if [ -n "$val" ]; then echo "$name: set (${#val} characters)"; else echo "::error::$name is missing or empty"; fi
          done
      - run: pip install "pyjwt[crypto]" requests
      - name: Set up App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SITE_BASE: ${{ github.event.inputs.site_base }}
        run: |
          case "${{ github.event.inputs.what }}" in
            listing) python3 app/tools/asc/asc_listing.py ;;
            testflight) python3 app/tools/asc/asc_testflight.py ;;
            invite) INVITE_EMAIL="${{ github.event.inputs.invite_email }}" python3 app/tools/asc/asc_invite.py ;;
            *) python3 app/tools/asc/asc_setup.py ;;
          esac
