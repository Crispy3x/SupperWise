# Builds Ridgeline Ops and uploads it to TestFlight as the existing SupperWise app (com.supperwise.app).
# Start it by hand: GitHub > Actions > "TestFlight" > Run workflow, choosing branch "ridgeline".
#
# Uses this repository's existing secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID     your 10-character Team ID
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     App Store Connect issuer ID
#   ASC_KEY_P8        the whole .p8 file's text, including the BEGIN and END lines (not base64)
# Fixed on purpose: bundle ID com.supperwise.app, prefix com.supperwise, version 3.0.0.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.supperwise.app
      BUNDLE_ID_PREFIX: com.supperwise
      APP_VERSION: 3.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Put the bundle ID, version and team ID into the project file
        run: |
          sed -i '' "s/com\.example\.ridgelineops/${BUNDLE_ID}/g" project.yml
          sed -i '' "s/bundleIdPrefix: com\.example/bundleIdPrefix: ${BUNDLE_ID_PREFIX}/" project.yml
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${APPLE_TEAM_ID}\"/" project.yml
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM\|bundleIdPrefix" project.yml

      - name: Install XcodeGen and make the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Save the App Store Connect key for this run only
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean key file whatever happened to the line breaks when the secret was pasted.
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\\n", "\n")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw))
          lines = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          open(sys.argv[1], "w").write(f"-----BEGIN PRIVATE KEY-----\n{lines}\n-----END PRIVATE KEY-----\n")
          PY
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build the archive
        run: |
          # Build number: a UTC timestamp such as 2611191530. It is far above 17 and above every earlier build.
          BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          echo "Version $APP_VERSION, build $BUILD_NUMBER"
          xcodebuild archive \
            -project RidgelineOps.xcodeproj \
            -scheme RidgelineOps \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RidgelineOps.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$APP_VERSION"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RidgelineOps.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
