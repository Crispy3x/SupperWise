name: TestFlight

# Builds Ridgeline Ops (the snow and landscaping business app) and uploads it to TestFlight under the
# existing Supperwise App Store record (bundle ID com.supperwise.app), version 3.0.0. Start it by hand:
# Actions > TestFlight > Run workflow, branch ridgeline-2. Uses the repository secrets already set up for Supperwise:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an Admin App Store Connect API key)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "upload = build and send to TestFlight. list-certificates = show the team's distribution certificates (changes nothing). clean-ci-certificates = revoke only certificates that CI made and nothing else uses."
        type: choice
        options: [upload, list-certificates, clean-ci-certificates]
        default: upload

concurrency:
  group: testflight-ridgeline-2
  cancel-in-progress: false

jobs:
  certificates:
    name: Certificates (${{ inputs.action }})
    if: inputs.action != 'upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v6
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: List the distribution certificates (and revoke CI leftovers if asked)
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "clean-ci-certificates" ]; then python3 tools/asc/asc_certs.py --revoke; else python3 tools/asc/asc_certs.py; fi

  upload:
    if: inputs.action == 'upload'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode on the machine
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISS" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Write the API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey_$KID.p8" <<'PY'
          import os, re, sys
          raw = os.environ["P8"].replace("\\n", "\n")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw))
          lines = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          open(sys.argv[1], "w").write(f"-----BEGIN PRIVATE KEY-----\n{lines}\n-----END PRIVATE KEY-----\n")
          PY
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KID.p8"

      - name: Distribution certificate and App Store profile (through Apple's API)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.supperwise.app
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]" requests
          P12_PASSWORD=$(openssl rand -hex 16); echo "::add-mask::$P12_PASSWORD"; echo "P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          OUT_DIR="$RUNNER_TEMP/signing" P12_PASSWORD="$P12_PASSWORD" "$RUNNER_TEMP/venv/bin/python" tools/asc/asc_signing.py

      - name: Install them in a temporary keychain
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/signing/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$(cat "$RUNNER_TEMP/signing/profile_name.txt")" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | head -3

      - name: Add Release signing to the app target and make the Xcode project
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          p = "project.yml"; lines = open(p).read().split("\n")
          start = next(i for i, l in enumerate(lines) if l == "      base:")
          end = start + 1
          while end < len(lines) and (lines[end].startswith("        ") or lines[end].strip() == ""):
              end += 1
          block = ["      configs:", "        Release:",
                   "          CODE_SIGN_STYLE: Manual",
                   '          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"',
                   f'          DEVELOPMENT_TEAM: "{os.environ["TEAM"]}"',
                   f'          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "{os.environ["PROFILE_NAME"]}"']
          lines[end:end] = block
          open(p, "w").write("\n".join(lines))
          print("Release signing added to the app target")
          PY
          brew install xcodegen
          xcodegen

      - name: Archive (signed for the App Store)
        run: |
          set -o pipefail
          # Build number: a UTC timestamp such as 2611191530. It is far above 17 and above every earlier build.
          BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          echo "Version 3.0.0, build $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project RidgelineOps.xcodeproj -scheme RidgelineOps -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/RidgelineOps.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION=3.0.0 \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE (SUCCEEDED|FAILED) \*\*"

      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.supperwise.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RidgelineOps.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "Uploaded Ridgeline Ops 3.0.0 build $BUILD_NUMBER to TestFlight."

      - name: Keep the archive log
        # Only exists if the build step ran; when an earlier step fails there is no log and that is fine.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Revoke the certificate this run created
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] || exit 0
          OUT_DIR="$RUNNER_TEMP/signing" "$RUNNER_TEMP/venv/bin/python" tools/asc/asc_revoke.py

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/build.keychain-db"
