name: TestFlight upload

# Run by hand (Actions tab → TestFlight upload → Run workflow). Archives the app, signs it with your Apple
# Developer team, and uploads it to App Store Connect / TestFlight. No Mac needed.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID     your 10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     App Store Connect issuer ID
#   ASC_KEY_P8        the whole .p8 file's text, including the BEGIN and END lines
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the machine
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISS" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Write the API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild clean PEM whatever happened to the line breaks when the key was pasted.
          python3 - "$RUNNER_TEMP/keys/AuthKey_$KID.p8" <<'PY'
          import os, re, sys
          raw = os.environ["P8"].replace("\\n", "\n")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw))
          lines = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          open(sys.argv[1], "w").write(f"-----BEGIN PRIVATE KEY-----\n{lines}\n-----END PRIVATE KEY-----\n")
          PY
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KID.p8"

      - name: Distribution certificate and App Store profile (through Apple's API)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]" requests
          P12_PASSWORD=$(openssl rand -hex 16); echo "::add-mask::$P12_PASSWORD"; echo "P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          OUT_DIR="$RUNNER_TEMP/signing" P12_PASSWORD="$P12_PASSWORD" "$RUNNER_TEMP/venv/bin/python" app/tools/asc/asc_signing.py

      - name: Install them in a temporary keychain
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/signing/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$(cat "$RUNNER_TEMP/signing/profile_name.txt")" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | head -3

      - name: Archive (signed for the App Store)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Manual signing for the app target's Release build only (Swift package targets must stay automatic).
          python3 - <<PY
          p = "app/Supperwise.xcodeproj/project.pbxproj"; s = open(p).read()
          marker = "5A0000000000000000000052 /* Release */ = {\n\t\t\tisa = XCBuildConfiguration;\n\t\t\tbuildSettings = {\n"
          assert marker in s, "app Release configuration not found"
          s = s.replace("\t\t\t\tCODE_SIGN_STYLE = Automatic;\n", "", 0)
          inject = ('\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM;\n'
                    '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";\n\t\t\t\t"CODE_SIGN_STYLE[sdk=iphoneos*]" = Manual;\n')
          i = s.index(marker) + len(marker)
          block_end = s.index("\t\t\t};", i)
          block = s[i:block_end].replace("\t\t\t\tCODE_SIGN_STYLE = Automatic;\n", "\t\t\t\tCODE_SIGN_STYLE = Manual;\n")
          s = s[:i] + inject + block + s[block_end:]
          open(p, "w").write(s)
          print("signing set on the app target (Release)")
          PY
          xcodebuild archive \
            -project app/Supperwise.xcodeproj -scheme Supperwise -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Supperwise.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | grep -E "error:|warning: .*Supperwise|\*\* ARCHIVE (SUCCEEDED|FAILED) \*\*"

      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.supperwise.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Supperwise.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple processes it (usually 10–30 minutes)."

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/build.keychain-db"
